<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AngelTiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1b1b'/%3E%3Cellipse cx='32' cy='12' rx='14' ry='5' fill='none' stroke='%23f5b942' stroke-width='3.5'/%3E%3Cpath d='M16 53 32 21 48 53M23 41h18' fill='none' stroke='%23f5b942' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#121212;--card:#1b1b1b;--line:#2b2b2b;--tx:#ededed;--mu:#8c8c8c;--ac:#f5b942;--px:"Pixelify Sans",Onest,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Onest,system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
h1{margin:0 0 12px;font-size:24px;display:flex;align-items:center;gap:10px}h1 em{font-style:normal}h1 span{color:var(--ac)}.lg{width:38px;height:38px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button,.b{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:inherit;font-size:13px}
.tabs button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.rk{width:28px;text-align:center;font-weight:700;color:var(--mu)}.r1{color:#f5b942}.r2{color:#c0c6d4}.r3{color:#d08a54}
.av{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;image-rendering:pixelated;display:block}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}.nm small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.tg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.t{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--line)}
.t.h{background:#f5b94233;color:var(--ac)}
.pn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.g label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}.g select{width:100%}
.mu{color:var(--mu);font-size:13px}
.ad{border-color:var(--ac)}
.c1{background:#f5b94233;color:#f5b942}.c2{background:#c9d1e033;color:#c9d1e0}.c3{background:#d08a5433;color:#e0a070}.c4{background:#6aa0ff22;color:#8db6ff}.c5{background:#8c8c8c22;color:#aab0c0}.cr{background:#9b6bff22;color:#b794ff}
.row{cursor:pointer;transition:transform .12s,border-color .12s}.row:hover{border-color:var(--ac);transform:translateY(-1px)}
.row.top1{border-color:#f5b94266}.row.top2{border-color:#c9d1e044}.row.top3{border-color:#d08a5444}
#md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
#md[hidden]{display:none}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto;text-align:center;position:relative}

.mc h2{margin:6px 0 2px}.mc .x{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--mu);font-size:24px;cursor:pointer}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;text-align:left}
.mg div{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--mu)}
.ic{width:20px;height:20px;image-rendering:pixelated;vertical-align:-4px;display:inline-block}.t .ic{width:16px;height:16px;vertical-align:-3px}.mg .ic{width:18px;height:18px}
.tt{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:6px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.nl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nt{overflow:hidden;text-overflow:ellipsis}
.ttc{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.ck{display:flex;gap:6px;align-items:center;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.hr{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px;text-align:left}
.hr .hd{color:var(--mu);font-size:11px;margin-top:2px}.hv{font-weight:700;white-space:nowrap}.hv.up{color:#34d27a}.hv.dn{color:#ef5b4b}.hv.nw{color:var(--ac)}.hv.rt{color:#b794ff}
.hd{display:flex;align-items:center;justify-content:space-between}
.mb{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;font-size:22px;padding:6px 12px;cursor:pointer}
.sec{font-size:20px;font-weight:600;margin:6px 0 10px;display:flex;align-items:center;gap:8px}.sec .ic{width:28px;height:28px}
#mn{position:fixed;inset:0;background:#000a;z-index:20;padding:12px;overflow:auto}#mn[hidden]{display:none}
.mp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:520px;margin:0 auto}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.mx{background:none;border:0;color:var(--tx);font-size:26px;cursor:pointer}
.ms{color:var(--mu);font-size:13px;margin:14px 0 6px}
.mi{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}.mi:hover,.mi.on{background:var(--bg)}.mi .ic{width:28px;height:28px}.mie{width:28px;text-align:center;font-size:20px}
.fc{position:relative;overflow:hidden;border-radius:16px;padding:14px 14px 14px 140px;min-height:160px;margin-bottom:10px;cursor:pointer;border:1px solid var(--line);background:linear-gradient(115deg,var(--g) -20%,#181818 70%)}
.fc{--g:#242424}.fc.f1{--g:#b3281c}.fc.f2{--g:#c58a1f}.fc.f3{--g:#5775ad}
.fc .sk{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:110px;height:110px;object-fit:contain}
.fn{font-size:20px;font-weight:700}.fc .nl{margin:4px 0}
.ft{display:flex;gap:8px;margin-top:12px}
.tl{flex:1;max-width:96px;border-radius:12px;padding:8px 2px;text-align:center}
.tl .ic{width:34px;height:34px;display:block;margin:0 auto}.tl b{display:block;margin-top:4px;font-size:17px}
.ph{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px}
.ph .ps3{height:120px;width:120px;object-fit:contain;flex:none}
.pl{flex:1;min-width:0}.pl h2{font-size:28px;margin:2px 0 4px}
.ps{display:flex;gap:26px;margin-top:10px}.ps b{display:block;font-size:30px}.ps span{color:var(--mu);font-size:13px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.pt{border-radius:12px;padding:8px 0;text-align:center}.pt .ic{width:30px;height:30px;display:block;margin:0 auto}.pt b{display:block;margin-top:4px;font-size:15px}.pt.em{opacity:.35}
.pb{display:flex;gap:8px;margin-top:14px}.pb .b{padding:12px}
h1,.sec,.fn,.pl h2,.mh b,.ps b{font-family:var(--px);letter-spacing:.3px}
h1{font-size:26px}.fn{font-size:21px}
.sx{display:flex;justify-content:space-between;align-items:center}
.row{flex-wrap:wrap}
@media(max-width:600px){.tg{max-width:100%;width:100%;justify-content:flex-start;order:5;margin-left:74px}}
</style></head><body><div class="w">
<div class="hd"><h1><svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1b1b1b"/><ellipse cx="32" cy="12" rx="14" ry="5" fill="none" stroke="#f5b942" stroke-width="3.5"/><path d="M16 53 32 21 48 53M23 41h18" fill="none" stroke="#f5b942" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg><em>Angel<span>Tiers</span></em></h1><button class="mb" id="mbtn" aria-label="Меню">☰</button></div>
<div class="sec" id="sec"></div>
<div class="bar"><input id="q" placeholder="Поиск игрока по нику…"></div>
<div class="mu" id="cnt" style="margin-bottom:8px"></div>

<div id="adm" class="pn ad" hidden>
  <b>Админ-режим</b> <span class="mu">— изменения сохраняются в этом браузере, пока не скачаешь и не зальёшь players.json на хост</span>
  <div class="bar"><input id="nn" placeholder="Ник игрока (новый или существующий)">
    <button class="b" id="sv">Сохранить</button><button class="b" id="dl" hidden>Удалить</button></div>
  <div class="g" id="gr"></div>
  <div class="mu" style="margin-top:10px">Титулы:</div><div class="bar" id="tt2" style="margin-top:4px"></div>
  <label class="ck" style="margin-top:10px;width:fit-content"><input type="checkbox" id="hl" checked> Записывать изменения тиров в историю</label>
  <div class="bar" style="margin-top:12px">
    <button class="b" id="pb" style="background:var(--ac);color:#111;border-color:var(--ac);font-weight:600">☁ Опубликовать на сайт</button>
    <button class="b" id="ex">⬇ Скачать players.json</button>
    <button class="b" id="rs">Сбросить к опубликованной</button></div>
  <div class="mu" id="ps" style="margin-top:6px"></div>
  <div class="bar"><input id="tk" type="password" autocomplete="off" placeholder="GitHub-токен (нужен один раз)"><button class="b" id="tks">Сохранить токен</button></div>
</div>

<div id="ls"></div>
<div class="mu" id="ft" style="margin-top:14px;text-align:center"></div>
</div>
<div id="mn" hidden><div class="mp" id="mp"></div></div>
<div id="md" hidden><div class="mc" id="mc"></div></div>
<script>
const MODES=[["DIAMONDPOT","🧪"],["NETHERITEPOT","🛡️"],["BEAST","⚔️"],["CARTPVP","🚃"],["CRYSTALPVP","💎"],["NETHERSMP","🚪"],["DIAMONDSMP","🔮"],["UHC","🪣"],["AXE","🪓"],["MACE","🔨"],["SPEARMACE","🔱"],["OP","🌀"],["CREEPER","💚"]];
const TIERS=["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
const PTS=[60,44,32,20,16,10,6,4,2,1];
const MC={DIAMONDPOT:"#5c1a36",NETHERITEPOT:"#5a1c1c",BEAST:"#1c3a57",CARTPVP:"#5a2d1a",CRYSTALPVP:"#46206b",NETHERSMP:"#5f3a1a",DIAMONDSMP:"#38205c",UHC:"#5c4a14",AXE:"#1d4a4d",MACE:"#2c3140",SPEARMACE:"#33262f",OP:"#174a35",CREEPER:"#1a4d1c"};
const RET=["RHT1","RLT1","RHT2","RLT2"];
const ALLT=[...TIERS,...RET];
const base=t=>t.replace(/^R/,"");
const pts=t=>t?(PTS[TIERS.indexOf(base(t))]||0):0;
const tc=t=>t[0]==="R"?"cr":"c"+t[2];
const TITLES=[{k:"owner",l:"ВЛАДЕЛЕЦ",c:"#ff3b3b"},{k:"admin",l:"АДМИНИСТРАЦИЯ ТИРЛИСТА",c:"#d9484f"},{k:"staff",l:"СТАФФ",c:"#b8434a"},{k:"manager",l:"МЕНЕДЖЕР ТИРЛИСТА",c:"#3a9be0"},{k:"ss",l:"SSER",c:"#25a05a"},{k:"mod",l:"МОДЕРАЦИЯ",c:"#62b3f2"},{k:"seniortester",l:"СТАРШИЙ ТЕСТЕР",c:"#ee8a2a"},{k:"tester",l:"ТЕСТЕР",c:"#34d27a"},{k:"famous",l:"FAMOUS",c:"#f3c614"},{k:"ht1sm",l:"HT1 SPEAR-MACE",c:"#e0357f"},{k:"restricted",l:"RESTRICTED",c:"#e6e6e6"}];
const badges=p=>(p.titles||[]).map(k=>TITLES.find(t=>t.k===k)).filter(Boolean).sort((a,b)=>TITLES.indexOf(a)-TITLES.indexOf(b)).map(t=>`<span class="tt" style="--c:${t.c}">${t.l}</span>`).join("");
const icon=(m,e)=>`<img class="ic" src="icons/${m.toLowerCase()}.png" alt="" onerror="this.outerHTML='${e}'">`;
const total=p=>MODES.reduce((a,[m])=>a+pts((p.tiers||{})[m]),0);
const SECRET="#panel-k7x2q9m4";   // админка открывается по адресу  сайт/#panel-k7x2q9m4 (можешь заменить на свою)
const ADMIN=location.hash===SECRET;
let mode="ALL",P=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const color=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 45% 45%)`};

function tabs(){
  const em=(MODES.find(x=>x[0]===mode)||[])[1];
  $("sec").innerHTML=mode==="ALL"?"🏆 Лидерборд":icon(mode,em)+" "+mode;
  const it=(m,i,l)=>`<div class="mi${m===mode?" on":""}" data-m="${m}">${m==="ALL"?`<span class="mie">${i}</span>`:icon(m,i)}<span>${l}</span></div>`;
  $("mp").innerHTML=`<div class="mh"><b>Меню</b><button class="mx">×</button></div><div class="ms">Основное</div>${it("ALL","🏆","Таблица лидеров")}<div class="ms">Тирлисты</div>${MODES.map(([m,e])=>it(m,e,m)).join("")}<div class="ms">Другое</div><div class="mi" data-s="1"><span class="mie">🔍</span><span>Поиск</span></div>`;
}
$("mbtn").onclick=()=>{$("mn").hidden=false};
$("mn").onclick=e=>{
  const b=e.target.closest("[data-m]");
  if(b){mode=b.dataset.m;tabs();render();$("mn").hidden=true;scrollTo(0,0)}
  else if(e.target.closest("[data-s]")){$("mn").hidden=true;$("q").focus()}
  else if(e.target.id==="mn"||e.target.closest(".mx"))$("mn").hidden=true;
};

const skin=(p,cls)=>`<img class="${cls}" src="https://mc-heads.net/head/${encodeURIComponent(p.name)}/300" data-u="${encodeURIComponent(p.name)}" alt="" onerror="if(this.dataset.f){this.style.display='none'}else{this.dataset.f=1;this.src='https://minotar.net/helm/'+this.dataset.u+'/200.png'}">`;
const best=p=>MODES.filter(([m])=>p.tiers?.[m]).sort((a,b)=>pts(p.tiers[b[0]])-pts(p.tiers[a[0]]));
const ava=p=>`<div class="av" style="background:${color(p.name)}"><img src="https://minotar.net/helm/${encodeURIComponent(p.name)}/72.png" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode(this.dataset.l))" data-l="${esc(p.name[0]||"?").toUpperCase()}"></div>`;
function row(p){
  const tg=mode==="ALL"?best(p).map(([m,ic])=>`<span class="t ${tc(p.tiers[m])}" title="${m}">${icon(m,ic)} ${p.tiers[m]}</span>`).join(""):`<span class="t ${tc(p.tiers[mode])}">${p.tiers[mode]}</span>`;
  return`<div class="row" data-n="${esc(p.name)}"><div class="rk">${p.r}</div>${ava(p)}<div class="nm"><div class="nl"><span class="nt">${esc(p.name)}</span>${badges(p)}</div><small>${p.s} очков</small></div><div class="tg">${tg}</div></div>`;
}
function feat(p){
  const T=mode==="ALL"?best(p).slice(0,3):[[mode,(MODES.find(x=>x[0]===mode)||[])[1]]];
  const tiles=T.map(([m,ic])=>`<div class="tl" style="background:${MC[m]||"#2b2b2b"}">${icon(m,ic)}<b>${p.tiers[m]}</b></div>`).join("");
  return`<div class="fc f${p.r}" data-n="${esc(p.name)}">${skin(p,"sk")}<div><div class="fn">${p.r}. ${esc(p.name)}</div><div class="nl">${badges(p)}</div><div class="mu">${p.s} очков</div><div class="ft">${tiles}</div></div></div>`;
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  let L=P.map(p=>({...p,s:mode==="ALL"?total(p):pts((p.tiers||{})[mode])}));
  if(mode!=="ALL")L=L.filter(p=>(p.tiers||{})[mode]);
  L.sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name));
  L.forEach((p,i)=>p.r=i+1);
  L=L.filter(p=>p.name.toLowerCase().includes(q));
  $("cnt").textContent="Игроков: "+L.length;
  $("ls").innerHTML=L.map(feat).join("")||`<div class="mu">${window.ERR?"Не удалось прочитать players.json (проверь кавычки и запятые в файле).":"Пока никого нет."}</div>`;
}

function histHtml(p){
  const H=[...(p.history||[])].reverse().sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  if(!H.length)return '<div class="mu" style="margin-top:10px">История пока пуста: изменения тиров появятся здесь.</div>';
  const ix=t=>TIERS.indexOf(base(t));
  return H.map(h=>{
    const e=(MODES.find(x=>x[0]===h.m)||[])[1]||"";
    let ch,cl;
    if(!h.f){ch=`Получил ${esc(h.t)}`;cl="nw"}
    else if(!h.t){ch=`${esc(h.f)} → убран`;cl="dn"}
    else if(ix(h.t)===ix(h.f)){ch=`${esc(h.f)} → ${esc(h.t)}`;cl="rt"}
    else if(ix(h.t)<ix(h.f)){ch=`${esc(h.f)} → ${esc(h.t)} ▲`;cl="up"}
    else{ch=`${esc(h.f)} → ${esc(h.t)} ▼`;cl="dn"}
    const dt=h.d?new Date(h.d+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"}):"";
    return `<div class="hr"><div style="flex:1;min-width:0"><div>${icon(h.m,e)} ${esc(h.m)}</div><div class="hd">${dt}</div></div><div class="hv ${cl}">${ch}</div></div>`;
  }).join("");
}
function openP(n){
  const p=find(n);if(!p)return;
  const all=[...P].sort((a,b)=>total(b)-total(a)||a.name.localeCompare(b.name));
  const rank=all.indexOf(p)+1;
  const tiles=[...MODES].sort((x,y)=>pts(p.tiers?.[y[0]])-pts(p.tiers?.[x[0]])).map(([m,ic])=>{const t=p.tiers?.[m];return`<div class="pt${t?"":" em"}" style="background:${MC[m]||"#2b2b2b"}" title="${m}">${icon(m,ic)}<b>${t||"—"}</b></div>`}).join("");
  $("mc").innerHTML=`<button class="x">×</button><div class="mu" style="text-align:left">Профиль игрока</div><div class="ph"><div class="pl"><h2>${esc(p.name)}</h2><div class="ttc" style="justify-content:flex-start">${badges(p)}</div><div class="ps"><div><b>${total(p)}</b><span>очков</span></div><div><b>#${rank}</b><span>в лидерборде</span></div></div></div>${skin(p,"ps3")}</div><div class="pg">${tiles}</div><div class="pb"><button class="b" id="lk" title="Скопировать ссылку">🔗</button><button class="b" id="hb" style="flex:1">📜 История тиров</button></div><div id="hist" hidden></div><div class="mu" style="margin-top:14px">angeltiers.abrdns.com</div>`;
  $("lk").onclick=async()=>{const u=location.origin+location.pathname+"?p="+encodeURIComponent(p.name);try{await navigator.clipboard.writeText(u);$("lk").textContent="✓"}catch(e){prompt("Ссылка:",u)}setTimeout(()=>{$("lk").textContent="🔗"},1500)};
  $("hb").onclick=()=>{const h=$("hist");if(h.hidden){h.innerHTML=histHtml(p);h.hidden=false;$("hb").textContent="▲ Скрыть историю"}else{h.hidden=true;$("hb").textContent="📜 История тиров"}};
  $("md").hidden=false;
}
/* ---------- админка ---------- */
const find=n=>P.find(x=>x.name.toLowerCase()===n.trim().toLowerCase());
const draft=()=>{try{localStorage.setItem("tiers_draft",JSON.stringify(P))}catch(e){}};
function tgrid(sel=[]){
  $("tt2").innerHTML=TITLES.map(t=>`<label class="ck" style="color:${t.c}"><input type="checkbox" data-t="${t.k}" ${sel.includes(t.k)?"checked":""}> ${t.l}</label>`).join("");
}
function grid(t={}){
  $("gr").innerHTML=MODES.map(([m])=>`<div><label>${m}</label><select data-m="${m}"><option value="">—</option>${ALLT.map(x=>`<option ${t[m]===x?"selected":""}>${x}</option>`).join("")}</select></div>`).join("");
}
function save(){
  const name=$("nn").value.trim(); if(!name)return;
  const tiers={}; document.querySelectorAll("#gr select").forEach(s=>{if(s.value)tiers[s.dataset.m]=s.value});
  const titles=[...document.querySelectorAll("#tt2 input:checked")].map(i=>i.dataset.t);
  const ex=find(name);
  const old=ex?(ex.tiers||{}):{};
  const dd=new Date(),d=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`;
  const ch=$("hl").checked?MODES.map(([m])=>({m,f:old[m]||null,t:tiers[m]||null,d})).filter(x=>x.f!==x.t):[];
  if(ex){ex.tiers=tiers;if(titles.length)ex.titles=titles;else delete ex.titles;if(ch.length)ex.history=[...(ex.history||[]),...ch]}
  else{const o={name,tiers};if(titles.length)o.titles=titles;if(ch.length)o.history=ch;P.push(o)}
  draft();render();$("dl").hidden=false;
}
function del(){
  const ex=find($("nn").value); if(!ex||!confirm("Удалить "+ex.name+"?"))return;
  P=P.filter(x=>x!==ex);draft();render();$("nn").value="";grid();tgrid();$("dl").hidden=true;
}
function exportJson(){
  const blob=new Blob([JSON.stringify(P,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="players.json";a.click();
}
const GH={owner:"qdjjsjzjd",repo:"angeltiers",path:"players.json"};
const tok=()=>{try{return localStorage.getItem("gh_token")||""}catch(e){return ""}};
function ps(t,err){$("ps").textContent=t;$("ps").style.color=err?"#e5484d":"var(--mu)"}
async function publish(){
  const t=tok();if(!t){ps("Сначала вставь токен ниже и нажми «Сохранить токен».",1);return}
  ps("Публикую…");
  const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
  const h={Authorization:"Bearer "+t,Accept:"application/vnd.github+json"};
  try{
    let sha;const g=await fetch(url,{headers:h});
    if(g.ok)sha=(await g.json()).sha;
    else if(g.status===401)throw new Error("Токен неверный или просрочен");
    else if(g.status!==404)throw new Error("Ошибка GitHub "+g.status);
    const body={message:"Update players",content:btoa(unescape(encodeURIComponent(JSON.stringify(P,null,2)))),sha};
    const r=await fetch(url,{method:"PUT",headers:{...h,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(r.status===403||r.status===404?"Нет прав: у токена должен быть доступ Contents → Read and write к репозиторию "+GH.repo:(e.message||"Ошибка "+r.status))}
    ps("✅ Опубликовано! Сайт обновится через 1–2 минуты.");
  }catch(e){ps("❌ "+e.message,1)}
}
async function published(){
  const r=await fetch("players.json?"+Date.now());
  const lm=r.headers.get("Last-Modified");if(lm){const d=new Date(lm);if(!isNaN(d))$("ft").textContent="Обновлено: "+d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
  return r.json();
}

async function init(){
  tabs();
  try{P=await published()}catch(e){P=[];window.ERR=1;return init2()}
  init2()}
function init2(){
  if(ADMIN){
    $("adm").hidden=false;grid();tgrid();
    try{const d=localStorage.getItem("tiers_draft");if(d)P=JSON.parse(d)}catch(e){}
    $("nn").oninput=e=>{const p=find(e.target.value);$("dl").hidden=!p;grid(p?.tiers);tgrid(p?.titles)};
    $("sv").onclick=save;$("dl").onclick=del;$("ex").onclick=exportJson;$("pb").onclick=publish;
    if(tok())$("tk").placeholder="Токен сохранён ✓ (вставь новый, чтобы заменить)";
    $("tks").onclick=()=>{const v=$("tk").value.trim();if(!v)return;try{localStorage.setItem("gh_token",v)}catch(e){}$("tk").value="";$("tk").placeholder="Токен сохранён ✓";ps("Токен сохранён в этом браузере.")};
    $("rs").onclick=async()=>{if(!confirm("Отбросить все локальные правки?"))return;
      try{localStorage.removeItem("tiers_draft")}catch(e){}
      try{P=await published()}catch(e){P=[]}render()};
    $("ls").onclick=e=>{const r=e.target.closest(".row,.fc");if(!r)return;
      const p=find(r.dataset.n);$("nn").value=p.name;grid(p.tiers);tgrid(p.titles);$("dl").hidden=false;scrollTo(0,0)};
  }else{
    $("ls").onclick=e=>{const r=e.target.closest(".row,.fc");if(r)openP(r.dataset.n)};
  }
  $("md").onclick=e=>{if(e.target.id==="md"||e.target.classList.contains("x"))$("md").hidden=true};
  addEventListener("keydown",e=>{if(e.key==="Escape"){$("md").hidden=true;$("mn").hidden=true}});
  render();
  const pq=new URLSearchParams(location.search).get("p");if(pq&&find(pq))openP(pq);
}
$("q").oninput=render;
init();
</script></body></html>
